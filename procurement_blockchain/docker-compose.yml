name: Procurement-Blockchain

services:

  procurement-blockchain-validator1:
      image: hyperledger/besu:${BESU_VERSION}
      container_name: procurement-blockchain-validator1

      environment: 
        BESU_OPTS: "-Xms512m -Xmx1g"

      networks:
        procurement-network:
          ipv4_address: 172.22.0.11

      volumes: 
        - ./network/genesis/genesis.json:/config/genesis.json
        - ./data/node1:/data
        - ./network/static-nodes.json:/config/static-nodes.json

      command:
        - --genesis-file=/config/genesis.json
        - --data-path=/data
        - --node-private-key-file=/data/key
        - --sync-mode=FULL
        - --sync-min-peers=1
        - --p2p-host=0.0.0.0
        - --p2p-interface=172.22.0.11
        - --p2p-port=30303
        - --nat-method=NONE
        - --rpc-http-enabled=true
        - --rpc-http-host=0.0.0.0
        - --rpc-http-port=8545
        - --rpc-http-api=ETH,NET,WEB3,ADMIN,QBFT
        - --host-allowlist=*
        - --static-nodes-file=/config/static-nodes.json
        - --min-gas-price=0

      ports:
        - "8545:8545"
        - "30303:30303"

      deploy:
        resources:
            limits:
              cpus: "1"
              memory: 1536M
            reservations:
              cpus: "0.5"
              memory: 1G

      restart: unless-stopped

      logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "5"

